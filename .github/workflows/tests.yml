name: Tests

# Runs the unit suite and the PRODUCT-CODE coverage floor gate
# (npm run quality:coverage). This workflow covers pushes to main and every PR.
#
# It is NO LONGER the only workflow running that gate. merge.yml runs it too, as
# of 2026-07-31, because the claude/** auto-merge path opens no pull request and
# so never triggered the pull_request job below -- the repo's one fully
# autonomous route to production was the one route with no coverage floor.
# merge.yml runs it twice: on the branch tip (fast-fail) and again on the merge
# commit before the push to main. Between the two workflows the gate now covers
# every path that can modify main. Still deliberately NOT in deploy.yml, for the
# reasons given below.
#
# Origin (2026-07-05): closed a gap where deploy.yml's push trigger path-filters
# to site-affecting files, so a push to main touching ONLY test files or scripts
# ran no CI at all. This workflow covered exactly that complement.
#
# NO PATH FILTER, deliberately (2026-07-31). Adding the coverage floor to a
# workflow filtered to test/**, tests/**, scripts/** INVERTED the gate: the
# product-code paths (src/**, functions/**, ...) belong to deploy.yml, and
# deploy.yml does not run quality:coverage. So a push that added untested code
# under functions/ deployed to production with the floor never evaluated, while
# a push touching only test files was gated. Commit 789d734d is the proof: it
# added functions/api/endo-quiz/download.js, 45 uncovered PRODUCT-CODE lines,
# touching only functions/ and src/, one commit after the floor was armed. This
# workflow did not fire, and the file stayed absent from the committed census --
# exactly the failure the floor was installed to prevent.
#
# A path allowlist is the wrong shape for THIS gate. Its denominator is the whole
# first-party surface (census-rules.mjs SURFACE_ROOTS: functions/**, scripts/**,
# src/lib, src/scripts, src/integrations, src/pages/*.ts, src/data/*.ts), and
# package.json alone changes which tests run. Every allowlist is a fresh hole in
# the shape of whatever nobody thought of. The job costs under a minute, so it
# runs on everything instead.
#
# The gate is intentionally NOT added to deploy.yml. deploy.yml also fires on
# repository_dispatch (single article/FAQ/glossary publish) and workflow_dispatch,
# so a coverage regression there would block content publishing that did not cause
# it, put a new failure mode on the publish path, and lengthen a queue that is
# serialized on one concurrency group -- and it still would not gate pull requests,
# since deploy.yml has no pull_request trigger. Catch it at PR time; alarm on main.

on:
  push:
    branches:
      - main
  # No path filter here either, for the reason build-verify.yml documents: a
  # path-filtered PR trigger never reports on non-matching PRs, which stalls a
  # required status check forever on "Expected". Always reporting means this job
  # can be made a required check.
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  # Supersede in-flight PR runs (a new push to the PR moots the old verdict), but
  # never cancel a main run: a cancelled run leaves that commit on main with no
  # coverage verdict at all, which is the silence this workflow exists to end.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The dependency family of the red-team harness
      # (scripts/redteam/deps.mjs): the production half of package-lock.json
      # against OSV.dev, ranked by CISA KEV and EPSS. It BLOCKS on a KEV
      # entry, on EPSS over 0.1, or on a HIGH/CRITICAL advisory whose fix is
      # already published; everything else prints as WARN and is never
      # hidden. Three public sources, no keys, no build, no install beyond
      # the one above.
      #
      # BEFORE the unit suite deliberately: it is the cheapest step in the
      # job and it answers a question the suite cannot ("is a dependency we
      # ship carrying a known-exploited hole"), so there is no reason to pay
      # for 4,000 tests before hearing it. An unreachable source FAILS the
      # step rather than passing it, since a gate that passes on an outage is
      # not a gate.
      #
      # A finding is accepted, never muted: scripts/redteam/deps-accepted.json
      # takes an id, a written reason and an expiry, and reports as KNOWN
      # until that date passes. test/deps.test.js proves the policy fires in
      # every direction it claims to, offline, over a captured fixture.
      - name: Dependency advisories (OSV + EPSS + KEV)
        run: node scripts/redteam/deps.mjs --no-report

      - name: Unit tests
        run: npm test

      # The coverage floor was enforced by hand until 2026-07-29, which meant raising it did not
      # actually block anything: a deploy that regressed coverage sailed through. The floor only
      # ratchets up (scripts/quality/census.mjs ARMED_FLOOR_PCT carries its history), so this step
      # is green on arrival by construction and fails only on a real regression.
      #
      # It also fails when the census drifts from the file tree in either direction, which is the
      # check that stops a new file being silently absent from the denominator. An absent file
      # reads as "not a gap" and is how whole surfaces stayed invisible here for months.
      - name: Coverage floor + census
        run: npm run quality:coverage
