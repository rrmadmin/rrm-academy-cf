name: Tests

# Closes a CI gap found in the 2026-07-05 hardening audit: deploy.yml's push
# trigger path-filters to site-affecting files, so a push to main touching ONLY
# test files or scripts ran no CI at all. This workflow runs the unit suite for
# exactly that complement. PR-side coverage already exists (merge.yml gates
# claude/** merges; deploy.yml runs npm test on every deploy).

on:
  push:
    branches:
      - main
    paths:
      - 'test/**'
      - 'tests/**'
      - 'scripts/**'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Unit tests
        run: npm test
