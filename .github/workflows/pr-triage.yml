name: pr-triage

# STANDALONE COPY for a repo outside the fivestarpractices org, GENERATED by
# fsp-ci scripts/build-pr-triage-workflow.mjs (standalone/pr-triage.yml).
# Do not edit here: edit fsp-ci src/pr-triage/, rebuild, and copy this file
# over. The org repos call the reusable workflow instead.
#
# Reusable, comment-only PR triage. A caller repo runs this on pull_request
# and passes its own TYPESAFE_API_KEY; fsp-ci itself holds no key and the job
# executes in the CALLER's context with the caller's GITHUB_TOKEN. One call
# to Jev per run, fifteen typed checks, verdict computed in code, posted as
# a single upserted comment. It never fails the PR: a red job means triage
# did not run, and even then it is not a required check anywhere.
#
# The triage source is embedded below because the caller's token cannot
# read this private repo, so a checkout of fsp-ci fails inside the caller's
# job. Embedding needs no extra secret in any consumer.
#
# Caller shape:
#   on: pull_request
#   jobs:
#     triage:
#       uses: fivestarpractices/fsp-ci/.github/workflows/pr-triage.yml@main
#       secrets:
#         TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

concurrency:
  group: pr-triage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Fork PRs get no secrets; skip rather than fail.
    if: github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Materialize the triage script (generated from fsp-ci src/pr-triage)
        run: |
          mkdir -p fsp-ci/src/pr-triage
          cat > fsp-ci/src/pr-triage/client.mjs <<'__FSP_CI_TRIAGE_EOF__'
          // Minimal HTTP client for POST /v1/systemone with backoff on 429 and 529.
          // No SDK: this repo has no dependencies on purpose.

          export const ENDPOINT = 'https://api.typesafe.ai/v1/systemone';
          export const MODEL = 'jev-latest';

          const RETRY_STATUSES = new Set([429, 529]);

          export async function evaluate({ apiKey, state, questions, fetchImpl = fetch, sleep = defaultSleep, maxAttempts = 4, model = MODEL }) {
            if (!apiKey) throw new Error('TYPESAFE_API_KEY is not set');
            const body = JSON.stringify({ state, model, questions });
            let lastErr;
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              let res;
              try {
                res = await fetchImpl(ENDPOINT, {
                  method: 'POST',
                  headers: { Authorization: `Bearer ${apiKey}`, 'Content-Type': 'application/json' },
                  body,
                });
              } catch (err) {
                lastErr = err;
                if (attempt < maxAttempts) { await sleep(backoff(attempt, null)); continue; }
                throw err;
              }
              if (res.ok) return res.json();
              const text = await res.text().catch(() => '');
              lastErr = new Error(`typesafe ${res.status}: ${text.slice(0, 300)}`);
              if (RETRY_STATUSES.has(res.status) && attempt < maxAttempts) {
                await sleep(backoff(attempt, res.headers?.get?.('retry-after')));
                continue;
              }
              throw lastErr;
            }
            throw lastErr;
          }

          export function backoff(attempt, retryAfter) {
            const ra = Number(retryAfter);
            if (Number.isFinite(ra) && ra > 0) return Math.min(ra * 1000, 30_000);
            return Math.min(1000 * 2 ** (attempt - 1), 30_000);
          }

          function defaultSleep(ms) { return new Promise((r) => setTimeout(r, ms)); }
          __FSP_CI_TRIAGE_EOF__
          cat > fsp-ci/src/pr-triage/questions.mjs <<'__FSP_CI_TRIAGE_EOF__'
          // The fifteen typed checks a pull request is judged against. Each is one
          // narrow judgment; the verdict is computed in code (verdict.mjs), never here.
          //
          // Noul answers are probabilities of YES. Score answers are a weighted position
          // on the ordered levels. Question ids are for code only; the model never sees
          // them, so every instruction carries its full meaning.

          export const NOUL = 'noul';
          export const SCORE = 'score';

          export const QUESTIONS = {
            hardcoded_secret: {
              type: NOUL,
              instructions: 'Does the diff ADD a literal credential: an API key, token, password, private key, webhook secret or connection string with an embedded password? Judge only added lines. A reference to an environment variable, a secrets manager path, a placeholder like "xxx", or a test fixture that is obviously fake is a NO.',
              criteria: { true: 'An added line contains a value that would work as a real credential', false: 'No real credential is added; env references, placeholders and obvious fakes only' },
            },
            sql_injection: {
              type: NOUL,
              instructions: 'Does the diff add SQL where untrusted input (request body, query string, path param, user-supplied text) is interpolated into the statement text instead of being passed as a bound parameter? Table or column names chosen from a fixed allowlist in code are a NO.',
              criteria: { true: 'Untrusted input reaches SQL text by string interpolation or concatenation', false: 'All user-supplied values are bound parameters, or no SQL is touched' },
            },
            touches_auth: {
              type: NOUL,
              instructions: 'Does the diff change authentication or authorization behaviour: session or token validation, login, signup, password flows, OAuth callbacks, role or permission checks, access gating middleware, CORS origins, cookie flags, or JWT verification?',
              criteria: { true: 'Auth or access-control logic changes', false: 'Auth code is untouched, or only comments and formatting change there' },
            },
            deletes_tests: {
              type: NOUL,
              instructions: 'Does the diff remove or disable tests: deleting test files, deleting test cases, marking tests skip or todo, commenting assertions out, loosening an assertion so it can no longer fail, or raising a tolerance to make a red test pass?',
              criteria: { true: 'Test coverage is reduced or a test is neutered', false: 'Tests are added, unchanged, or only refactored with the same assertions' },
            },
            breaks_api: {
              type: NOUL,
              instructions: 'Does the diff change a contract that other code or other systems depend on in a non-backward-compatible way (a removed or renamed route, a changed response shape, a removed field, a changed status code, a renamed exported function, a changed CLI flag, or a changed environment variable name) AND leave a caller behind: the diff does not update every caller it contains, and the description does not state that the change is deliberate and names how callers are handled? A deliberate tightening that the description explains (fail closed, verify a signature, require a role, go live for everyone) is a NO. Judge the unhandled breakage, not the fact of a change.',
              criteria: { true: 'An existing caller would break and nothing in the diff or description accounts for it', false: 'Changes are additive or internal, every caller in the diff is updated, or the description states the change is deliberate and how callers are handled' },
            },
            has_migration: {
              type: NOUL,
              instructions: 'Does the diff include a database schema change: a migration file, CREATE or ALTER or DROP TABLE, an added or removed column, an index change, or a data backfill statement?',
              criteria: { true: 'Schema or data migration present', false: 'No schema change' },
            },
            debug_leftovers: {
              type: NOUL,
              instructions: 'Does the diff add debugging residue that should not ship: console.log or print statements used for tracing, debugger statements, commented-out code blocks, TODO or FIXME markers on the change itself, hard-coded localhost URLs, or a temporarily disabled guard? Deliberate structured logging is a NO.',
              criteria: { true: 'Debug residue is added', false: 'No debug residue, or only intentional logging' },
            },
            description_matches_diff: {
              type: NOUL,
              instructions: 'Read the pull request title and body, then the diff. Does the description accurately and completely describe what the diff does? A description that omits a material change (for example it says "fix 404s" while the diff also publishes new content, or it says "refactor" while behaviour changes) is a NO. A short description is fine if nothing material is missing.',
              criteria: { true: 'The description covers every material change and claims nothing the diff does not do', false: 'The diff does something material the description does not mention, or claims something the diff does not do' },
            },
            ships_held_content: {
              type: NOUL,
              instructions: 'Does the change publish, enable, or merge to the default branch something that the head branch name, the description, file paths, or comments in the diff mark as held, draft, WIP, pending review, awaiting sign-off, unvetted, or not yet approved? A branch named held/... or draft/... that adds user-facing pages is a strong YES unless the description states the hold was lifted and by whom. A hold on RUNNING something after merge is a NO: a migration file marked hold for apply, a job marked do not schedule yet, a feature behind a flag that stays off. The question is whether merging itself publishes held content. Judge the signal, not the code quality.',
              criteria: { true: 'Held or unapproved content is being shipped without a stated release of the hold', false: 'Nothing indicates a hold, or the hold is explicitly stated as lifted' },
            },
            touches_money: {
              type: NOUL,
              instructions: 'Does the diff change code on a payment or money path: Stripe or other payment provider calls, webhook handlers for payments, checkout, subscriptions, invoices, payouts, refunds, prices, donation amounts, or finance ledgers and their sync?',
              criteria: { true: 'Payment or finance code changes', false: 'No money path touched' },
            },
            touches_ci: {
              type: NOUL,
              instructions: 'Does the diff change continuous-integration or deployment machinery: GitHub Actions workflows, runner configuration, deploy scripts, wrangler or Pages configuration, branch protection or required checks, or the scripts a workflow calls?',
              criteria: { true: 'CI or deploy machinery changes', false: 'CI and deploy files untouched' },
            },
            risky_data_write: {
              type: NOUL,
              instructions: 'Does the diff add or change code that can destroy or overwrite live data at scale: DELETE without a narrow WHERE, TRUNCATE or DROP of a populated table, a replace-all sync that removes rows absent from its input, a bulk UPDATE, an rclone or rsync with delete semantics, or a cache or KV flush? Schema DDL that adds a table, column, index or constraint is a NO. A table rebuild inside a migration (create the new shape, INSERT ... SELECT every row, DROP the old table, rename) is a NO when the copy precedes the drop; a DROP or column removal with no preceding copy is a YES.',
              criteria: { true: 'A bulk destructive or overwriting write is added or widened', false: 'Writes are row-scoped, additive, or absent, or the change is additive schema DDL' },
            },
            missing_tests_for_logic: {
              type: NOUL,
              instructions: 'Does the diff add or change non-trivial logic (branching, parsing, calculation, validation, data transformation) without adding or updating a test that exercises it? Pure documentation, configuration, styling, or copy changes are a NO. A diff that already includes matching test changes is a NO.',
              criteria: { true: 'New or changed logic ships with no accompanying test', false: 'Logic changes are tested, or the change has no logic' },
            },
            blast_radius: {
              type: SCORE,
              instructions: 'How much of the running system could this change affect if it is wrong?',
              criteria: [
                'One file or one isolated function; a fault is local and obvious',
                'One feature or one endpoint; a fault affects users of that feature',
                'A shared module, middleware, schema or config used across many features',
                'System-wide: build pipeline, deploy, auth, data layer or infrastructure that everything depends on',
              ],
            },
            reviewer_effort: {
              type: SCORE,
              instructions: 'How much careful attention does a competent reviewer need to give this diff to be confident it is correct?',
              criteria: [
                'A glance: trivial, mechanical, or documentation only',
                'A few minutes: small and self-explanatory',
                'A focused read: moderate size or some subtle logic',
                'A deep review: large, subtle, security-relevant, or touching several systems at once',
              ],
            },
          };

          export const QUESTION_IDS = Object.freeze(Object.keys(QUESTIONS));
          __FSP_CI_TRIAGE_EOF__
          cat > fsp-ci/src/pr-triage/render.mjs <<'__FSP_CI_TRIAGE_EOF__'
          // Renders the PR comment. The marker lets the workflow find and update its
          // own comment instead of stacking a new one per push.

          export const MARKER = '<!-- fsp-ci pr-triage -->';

          const LABELS = {
            hardcoded_secret: 'Hardcoded secret',
            sql_injection: 'SQL injection',
            touches_auth: 'Touches auth',
            deletes_tests: 'Deletes or neuters tests',
            breaks_api: 'Breaks a contract',
            has_migration: 'Schema migration',
            debug_leftovers: 'Debug leftovers',
            description_matches_diff: 'Description matches diff',
            ships_held_content: 'Ships held content',
            touches_money: 'Touches money path',
            touches_ci: 'Touches CI or deploy',
            risky_data_write: 'Bulk destructive write',
            missing_tests_for_logic: 'Logic without tests',
            blast_radius: 'Blast radius',
            reviewer_effort: 'Reviewer effort',
          };

          const VERDICT_TEXT = {
            BLOCK: 'BLOCK (advisory)',
            ESCALATE: 'ESCALATE: a critical check is unsure, get a human or a reasoning model to look',
            SECURITY_REVIEW: 'SECURITY REVIEW: auth, money or wide blast radius',
            NITS: 'NITS: merge after a tidy',
            MERGE: 'MERGE: nothing flagged',
          };

          function pct(p) { return `${Math.round(p * 100)}%`; }

          function bar(p) {
            const n = Math.round(p * 10);
            return '█'.repeat(n) + '░'.repeat(10 - n);
          }

          export function renderComment({ answers, verdict, usage, model, stateInfo, costUsd }) {
            const lines = [];
            lines.push(MARKER);
            lines.push(`### PR triage: ${VERDICT_TEXT[verdict.level] || verdict.level}`);
            lines.push('');
            lines.push('Comment-only. This never blocks a merge; the verdict is a routing hint computed in code from the probabilities below.');
            lines.push('');
            if (verdict.reasons.length) lines.push(`**Flagged:** ${verdict.reasons.join(', ')}`);
            if (verdict.escalations.length) lines.push(`**Unsure:** ${verdict.escalations.join('; ')}`);
            if (verdict.security.length) lines.push(`**Review focus:** ${verdict.security.join(', ')}`);
            if (verdict.nits.length) lines.push(`**Nits:** ${verdict.nits.join(', ')}`);
            lines.push('');
            lines.push('| Check | Answer | |');
            lines.push('|---|---|---|');
            for (const [id, label] of Object.entries(LABELS)) {
              const a = answers[id];
              if (!a) { lines.push(`| ${label} | no answer | |`); continue; }
              if (a.type === 'noul') lines.push(`| ${label} | ${pct(a.noul)} | \`${bar(a.noul)}\` |`);
              else if (a.type === 'score') {
                const max = Object.keys(a.legend || {}).length - 1;
                const top = a.legend ? a.legend[String(Math.round(a.score))] : '';
                lines.push(`| ${label} | ${a.score.toFixed(1)} of ${max} | ${top} |`);
              }
            }
            lines.push('');
            const meta = [];
            if (model) meta.push(`model ${model}`);
            if (usage) meta.push(`${usage.input_tokens} input tokens`);
            if (typeof costUsd === 'number') meta.push(`about $${costUsd.toFixed(5)}`);
            if (stateInfo) {
              meta.push(`${stateInfo.kept} files in diff`);
              if (stateInfo.dropped.length) meta.push(`${stateInfo.dropped.length} omitted: ${stateInfo.dropped.map((d) => d.path).join(', ')}`);
            }
            lines.push(`<sub>${meta.join(' · ')}</sub>`);
            return lines.join('\n');
          }
          __FSP_CI_TRIAGE_EOF__
          cat > fsp-ci/src/pr-triage/state.mjs <<'__FSP_CI_TRIAGE_EOF__'
          // Builds the `state` sent to the model from a PR's title, body and diff, and
          // keeps it inside the model's context budget without hiding what was cut.

          // Jev 1.13: 32k tokens for state plus the longest question. Chars per token
          // on unified diffs measured 2.6 (78k chars = 30.4k tokens), so 60k chars keeps
          // a real margin under the state limit.
          export const MAX_DIFF_CHARS = 60_000;
          export const MAX_BODY_CHARS = 8_000;

          // Generated or vendored files carry no review signal and eat the budget.
          const NOISE = [
            /^package-lock\.json$/, /^pnpm-lock\.yaml$/, /^yarn\.lock$/, /\.lock$/,
            /(^|\/)dist\//, /(^|\/)out\//, /(^|\/)build\//, /(^|\/)node_modules\//,
            /(^|\/)vendor\//, /\.min\.(js|css)$/, /\.map$/, /\.snap$/,
            /(^|\/)coverage\//, /\.(png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf|pdf)$/i,
          ];

          export function isNoise(path) {
            return NOISE.some((re) => re.test(path));
          }

          // Split a unified diff into per-file chunks keyed by the b/ path.
          export function splitDiff(diff) {
            const files = [];
            const parts = diff.split(/^(?=diff --git )/m).filter(Boolean);
            for (const part of parts) {
              const m = part.match(/^diff --git a\/(.+?) b\/(.+)$/m);
              const path = m ? m[2] : '(unknown)';
              files.push({ path, text: part });
            }
            return files;
          }

          export function buildState({ title, body, diff, repo, base, head }) {
            const files = splitDiff(diff || '');
            const kept = [];
            const dropped = [];
            let used = 0;
            for (const f of files) {
              if (isNoise(f.path)) { dropped.push({ path: f.path, reason: 'generated or binary' }); continue; }
              if (used + f.text.length > MAX_DIFF_CHARS) { dropped.push({ path: f.path, reason: 'over budget' }); continue; }
              kept.push(f.text);
              used += f.text.length;
            }
            const omitted = dropped.length
              ? dropped.map((d) => `${d.path} (${d.reason})`)
              : [];
            const state = {
              repository: repo || '',
              base_branch: base || '',
              head_branch: head || '',
              pull_request: {
                title: (title || '').slice(0, 500),
                body: (body || '').slice(0, MAX_BODY_CHARS),
              },
              diff: kept.join(''),
              files_changed: files.map((f) => f.path),
              files_omitted_from_diff: omitted,
              note: omitted.length
                ? 'Some changed files are listed but their diff is omitted; judge them by name and by the rest of the change. Do not assume an omitted file is safe.'
                : 'The diff is complete.',
            };
            return { state, kept: kept.length, dropped };
          }
          __FSP_CI_TRIAGE_EOF__
          cat > fsp-ci/src/pr-triage/triage.mjs <<'__FSP_CI_TRIAGE_EOF__'
          #!/usr/bin/env node
          // PR triage entry point. Reads the PR's title, body and diff, asks Jev the
          // fifteen typed questions in ONE request, computes the verdict in code and
          // writes a Markdown comment plus a JSON record. Exit code is 0 on any
          // verdict: this is comment-only by design. It exits non-zero only when it
          // could not produce an answer at all (missing key, API failure), so a red
          // step means "triage did not run", never "the PR is bad".
          //
          // Inputs (env):
          //   TYPESAFE_API_KEY   required
          //   PR_TITLE, PR_BODY  the pull request description
          //   PR_DIFF_FILE       path to the unified diff (from `gh pr diff`)
          //   PR_REPO, PR_BASE, PR_HEAD   context strings
          //   TRIAGE_OUT_MD      where to write the comment (default triage-comment.md)
          //   TRIAGE_OUT_JSON    where to write the record (default triage.json)

          import { readFileSync, writeFileSync } from 'node:fs';
          import { QUESTIONS } from './questions.mjs';
          import { buildState } from './state.mjs';
          import { evaluate } from './client.mjs';
          import { verdict } from './verdict.mjs';
          import { renderComment } from './render.mjs';

          // Jev 1.13 list price per million input tokens; output tokens are free.
          // Display only. Update when the models page changes.
          export const USD_PER_MTOK = Number(process.env.TYPESAFE_USD_PER_MTOK || '0.042');

          export async function run(env = process.env, deps = {}) {
            const apiKey = env.TYPESAFE_API_KEY;
            if (!apiKey) throw new Error('TYPESAFE_API_KEY is not set');
            const diff = env.PR_DIFF_FILE ? readFileSync(env.PR_DIFF_FILE, 'utf8') : '';
            const { state, kept, dropped } = buildState({
              title: env.PR_TITLE, body: env.PR_BODY, diff,
              repo: env.PR_REPO, base: env.PR_BASE, head: env.PR_HEAD,
            });
            const res = await evaluate({ apiKey, state, questions: QUESTIONS, fetchImpl: deps.fetchImpl, sleep: deps.sleep });
            const answers = res.answers || {};
            const v = verdict(answers);
            const costUsd = res.usage ? (res.usage.input_tokens / 1e6) * USD_PER_MTOK : undefined;
            const md = renderComment({ answers, verdict: v, usage: res.usage, model: res.model, stateInfo: { kept, dropped }, costUsd });
            const record = { verdict: v, answers, usage: res.usage, model: res.model, files_kept: kept, files_dropped: dropped, cost_usd: costUsd };
            writeFileSync(env.TRIAGE_OUT_MD || 'triage-comment.md', md);
            writeFileSync(env.TRIAGE_OUT_JSON || 'triage.json', JSON.stringify(record, null, 2));
            return record;
          }

          if (import.meta.url === `file://${process.argv[1]}`) {
            run().then((r) => {
              console.log(`pr-triage: ${r.verdict.level} (${r.usage?.input_tokens ?? '?'} input tokens)`);
            }).catch((err) => {
              console.error(`pr-triage: could not run: ${err.message}`);
              process.exit(1);
            });
          }
          __FSP_CI_TRIAGE_EOF__
          cat > fsp-ci/src/pr-triage/verdict.mjs <<'__FSP_CI_TRIAGE_EOF__'
          // Turns the fifteen raw answers into one verdict. Policy lives here, in code,
          // so a threshold change never needs another inference call.
          //
          // Bands (Noul probabilities):
          //   >= HIGH        the condition holds
          //   LOW .. HIGH    the model is unsure: escalate, never guess
          //   <  LOW         the condition does not hold
          //
          // CRITICAL checks decide BLOCK / ESCALATE. Others only annotate.

          export const LOW = 0.35;
          export const HIGH = 0.65;

          export const VERDICTS = Object.freeze(['BLOCK', 'ESCALATE', 'SECURITY_REVIEW', 'NITS', 'MERGE']);

          // Critical checks and the direction that is bad. `bad: 'yes'` means a high
          // probability is the problem; `bad: 'no'` means a LOW probability is.
          export const CRITICAL = Object.freeze({
            hardcoded_secret: 'yes',
            sql_injection: 'yes',
            deletes_tests: 'yes',
            breaks_api: 'yes',
            risky_data_write: 'yes',
            description_matches_diff: 'no',
            ships_held_content: 'yes',
          });

          export const SECURITY = Object.freeze(['touches_auth', 'touches_money']);
          export const NITS = Object.freeze(['debug_leftovers', 'missing_tests_for_logic']);

          export function band(p) {
            if (typeof p !== 'number' || Number.isNaN(p)) return 'unknown';
            if (p >= HIGH) return 'yes';
            if (p < LOW) return 'no';
            return 'unsure';
          }

          function noul(answers, id) {
            const a = answers[id];
            return a && a.type === 'noul' ? a.noul : undefined;
          }

          function score(answers, id) {
            const a = answers[id];
            return a && a.type === 'score' ? a.score : undefined;
          }

          export function verdict(answers) {
            const reasons = [];
            const escalations = [];
            const security = [];
            const nits = [];

            for (const [id, bad] of Object.entries(CRITICAL)) {
              const p = noul(answers, id);
              const b = band(p);
              if (b === 'unknown') { escalations.push(`${id}: no answer`); continue; }
              if (b === 'unsure') { escalations.push(`${id}: ${p.toFixed(2)} is in the ${LOW}-${HIGH} band`); continue; }
              if (b === bad) reasons.push(`${id}: ${p.toFixed(2)}`);
            }

            for (const id of SECURITY) {
              const p = noul(answers, id);
              if (band(p) === 'yes') security.push(`${id}: ${p.toFixed(2)}`);
            }
            const blast = score(answers, 'blast_radius');
            if (typeof blast === 'number' && blast >= 2.5) security.push(`blast_radius: ${blast.toFixed(1)} of 3`);

            for (const id of NITS) {
              const p = noul(answers, id);
              if (band(p) === 'yes') nits.push(`${id}: ${p.toFixed(2)}`);
            }

            let level;
            if (reasons.length) level = 'BLOCK';
            else if (escalations.length) level = 'ESCALATE';
            else if (security.length) level = 'SECURITY_REVIEW';
            else if (nits.length) level = 'NITS';
            else level = 'MERGE';

            return { level, reasons, escalations, security, nits };
          }
          __FSP_CI_TRIAGE_EOF__

      - name: Fetch the PR diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr diff "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}" > pr.diff

      - name: Triage
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_REPO: ${{ github.repository }}
          PR_BASE: ${{ github.event.pull_request.base.ref }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          PR_DIFF_FILE: pr.diff
          TRIAGE_OUT_MD: triage-comment.md
          TRIAGE_OUT_JSON: triage.json
        run: node fsp-ci/src/pr-triage/triage.mjs

      - name: Upsert the comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          existing=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '[.[] | select(.body | startswith("<!-- fsp-ci pr-triage -->")) | .id] | first // empty')
          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@triage-comment.md > /dev/null
            echo "updated comment $existing"
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@triage-comment.md > /dev/null
            echo "created comment"
          fi

      - name: Keep the record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-triage-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          path: |
            triage.json
            triage-comment.md
          if-no-files-found: ignore
          retention-days: 30
