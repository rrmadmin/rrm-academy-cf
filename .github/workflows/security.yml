name: Security
# Trigger restricted to main + pull_request (backlog #15, 2026-05-27 audit):
# the claude/* -> auto-merge -> main flow used to fire this workflow three
# times (push claude/**, pull_request, push main). The claude/** push run is
# redundant: the local pre-commit hook runs `gitleaks protect --staged`
# (scripts/install-gitleaks-hook.mjs), and the auto-merge lands on main where
# the push trigger scans the full history (fetch-depth: 0) minutes later.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
