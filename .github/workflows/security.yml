name: Security
# Trigger restricted to main + pull_request (backlog #15, 2026-05-27 audit):
# the claude/* -> auto-merge -> main flow used to fire this workflow three
# times (push claude/**, pull_request, push main). The claude/** push run is
# redundant: the local pre-commit hook runs `gitleaks protect --staged`
# (scripts/install-gitleaks-hook.mjs), and the auto-merge lands on main where
# the push trigger scans the full history (fetch-depth: 0) minutes later.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
