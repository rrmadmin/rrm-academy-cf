name: Build Verify

# Durable upgrade gate (added 2026-07-05). Runs the FULL production build chain
# hermetically (npm run build:fixture -- synthetic data, no secrets) whenever a PR
# changes the dependency/build-config surface. Purpose: prove the site still builds
# BEFORE a framework/dependency bump merges, so Astro majors (and Dependabot's
# grouped astro PRs) can't silently break the build on main.
#
# The job runs on EVERY PR so it can be a REQUIRED status check (a path-filtered
# workflow never reports on non-matching PRs, which stalls required-check merges
# forever on "Expected"). The heavy build is gated by an in-job diff check instead:
# PRs that don't touch the dependency/build-config surface complete green in
# seconds without installing anything. Enforced by the `main` repository ruleset
# (bypass: RRM Admin Automation app + repo admins) added 2026-07-05.

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: build-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Replaces the old `on.pull_request.paths` filter so the job always reports.
      # Keep this list in sync with the build-surface files the old filter named.
      - name: Detect dependency/build-config changes
        id: surface
        run: |
          git fetch origin ${{ github.base_ref }} --depth=1
          CHANGED=$(git diff --name-only "origin/${{ github.base_ref }}"...HEAD -- \
            package.json \
            package-lock.json \
            astro.config.mjs \
            tsconfig.json \
            .github/workflows/build-verify.yml \
            scripts/build-fixture.mjs \
            scripts/verify-build-output.mjs \
            scripts/fixtures/)
          if [ -n "$CHANGED" ]; then
            echo "hit=true" >> "$GITHUB_OUTPUT"
            echo "Build surface changed:"; echo "$CHANGED"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
            echo "No dependency/build-config changes -- skipping hermetic build (reports green)."
          fi

      - name: Setup Node
        if: steps.surface.outputs.hit == 'true'
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.surface.outputs.hit == 'true'
        run: npm ci

      # Runs the entire real build chain (pre-build scripts + astro build +
      # pagefind + postbuild hooks) against staged synthetic fixtures, then
      # asserts structural invariants on dist/ via verify-build-output.mjs.
      - name: Hermetic fixture build
        if: steps.surface.outputs.hit == 'true'
        run: npm run build:fixture
