<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-label="RRM live-birth rate by diagnosis">
  <title>RRM Live-Birth Rate by Diagnostic Subgroup</title>
  <desc>Horizontal bars of crude take-home-baby (live birth) rate within each diagnostic subgroup from Sanchez-Mendez 2025, ranging from 36.9 percent for general conditions to 24.0 percent for other conditions, each labeled with its count over subgroup total.</desc>
  <rect width="760" height="540" fill="#ffffff"/>
  <style>
    .heading { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #636261; letter-spacing: 0.05em; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #636261; }
    .label { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #636261; dominant-baseline: central; }
    .label-end { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #636261; text-anchor: end; dominant-baseline: central; }
    .label-mid { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #636261; text-anchor: middle; }
    .small { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 400; fill: #987da8; }
    .value { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; fill: #313131; dominant-baseline: central; }
    .value-mid { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #313131; text-anchor: middle; }
    .value-accent { fill: #725e7e; }
    .axis { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: #987da8; text-anchor: middle; }
    .axis-y { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: #987da8; text-anchor: end; dominant-baseline: central; }
    .caption { font-family: 'Inter', sans-serif; font-size: 11.5px; font-style: italic; fill: #987da8; }
    .legend { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #636261; dominant-baseline: central; }
    .attribution { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #8a8985; letter-spacing: 0.04em; text-anchor: end; }
    .flag { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #b45309; }
    .flagnote { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #b45309; }
    
  </style>
  <text x="30" y="50" class="heading">LIVE-BIRTH RATE BY DIAGNOSIS</text>
  <line x1="30" y1="63" x2="730" y2="63" stroke="#c9b8d3" stroke-width="1"/>
  <text x="30" y="78" class="subtitle">Crude take-home-baby rate within each diagnostic subgroup (Sanchez-Mendez 2025). Couples may carry multiple diagnoses.</text>
  <line x1="290" y1="97" x2="290" y2="471" stroke="#ece9e5" stroke-width="1"/>
  <text x="290" y="487" class="axis">0%</text>
  <line x1="322" y1="97" x2="322" y2="471" stroke="#ece9e5" stroke-width="1"/>
  <text x="322" y="487" class="axis">10%</text>
  <line x1="354" y1="97" x2="354" y2="471" stroke="#ece9e5" stroke-width="1"/>
  <text x="354" y="487" class="axis">20%</text>
  <line x1="386" y1="97" x2="386" y2="471" stroke="#ece9e5" stroke-width="1"/>
  <text x="386" y="487" class="axis">30%</text>
  <line x1="418" y1="97" x2="418" y2="471" stroke="#ece9e5" stroke-width="1"/>
  <text x="418" y="487" class="axis">40%</text>
  <text x="278" y="119" class="label-end">General conditions</text>
  <rect x="290" y="105" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="105" width="118.1" height="28" rx="3" fill="#725e7e"/>
  <text x="416.1" y="119" class="value">36.9%</text>
  <text x="460.1" y="119" class="small" dominant-baseline="central">(n=89/241)</text>
  <text x="278" y="167" class="label-end">Functional (hormonal) disorders</text>
  <rect x="290" y="153" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="153" width="107.2" height="28" rx="3" fill="#725e7e"/>
  <text x="405.2" y="167" class="value">33.5%</text>
  <text x="449.2" y="167" class="small" dominant-baseline="central">(n=375/1121)</text>
  <text x="278" y="215" class="label-end">Abnormalities of cervical mucus</text>
  <rect x="290" y="201" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="201" width="103.0" height="28" rx="3" fill="#725e7e"/>
  <text x="401.0" y="215" class="value">32.2%</text>
  <text x="445.0" y="215" class="small" dominant-baseline="central">(n=108/335)</text>
  <text x="278" y="263" class="label-end">Endometrial disorders</text>
  <rect x="290" y="249" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="249" width="100.8" height="28" rx="3" fill="#725e7e"/>
  <text x="398.8" y="263" class="value">31.5%</text>
  <text x="442.8" y="263" class="small" dominant-baseline="central">(n=151/479)</text>
  <text x="278" y="311" class="label-end">Male factor</text>
  <rect x="290" y="297" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="297" width="97.0" height="28" rx="3" fill="#725e7e"/>
  <text x="395.0" y="311" class="value">30.3%</text>
  <text x="439.0" y="311" class="small" dominant-baseline="central">(n=138/455)</text>
  <text x="278" y="359" class="label-end">Endometriosis</text>
  <rect x="290" y="345" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="345" width="89.3" height="28" rx="3" fill="#725e7e"/>
  <text x="387.3" y="359" class="value">27.9%</text>
  <text x="431.3" y="359" class="small" dominant-baseline="central">(n=87/312)</text>
  <text x="278" y="407" class="label-end">Tubal factor</text>
  <rect x="290" y="393" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="393" width="81.3" height="28" rx="3" fill="#725e7e"/>
  <text x="379.3" y="407" class="value">25.4%</text>
  <text x="423.3" y="407" class="small" dominant-baseline="central">(n=44/173)</text>
  <text x="278" y="455" class="label-end">Other conditions</text>
  <rect x="290" y="441" width="320" height="28" rx="3" fill="#f0eeeb"/>
  <rect x="290" y="441" width="76.8" height="28" rx="3" fill="#725e7e"/>
  <text x="374.8" y="455" class="value">24.0%</text>
  <text x="418.8" y="455" class="small" dominant-baseline="central">(n=23/96)</text>
  <text x="30" y="515" class="caption">RRM produces broadly comparable live-birth rates across diverse diagnoses — it treats the underlying cause rather than bypassing it.</text>
  <text x="30" y="533" class="caption">Source: Sanchez-Mendez et al. 2025 (Table 1). Subgroups are not mutually exclusive.</text>
  <text x="730" y="528" class="attribution">rrmacademy.org/rrm-success-rates</text>
</svg>