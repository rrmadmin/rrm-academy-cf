<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-label="RRM live-birth rate by maternal age">
  <title>RRM Cumulative Live-Birth Rate by Maternal Age</title>
  <desc>Vertical bars of adjusted cumulative take-home-baby (live birth) rate by maternal age band from Sanchez-Mendez 2025: 83.7 percent at 18-30, 63.2 percent at 31-35, 53.3 percent at 36-40, and 24.4 percent above 40.</desc>
  <rect width="760" height="460" fill="#ffffff"/>
  <style>
    .heading { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #636261; letter-spacing: 0.05em; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #636261; }
    .label { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #636261; dominant-baseline: central; }
    .label-end { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 400; fill: #636261; text-anchor: end; dominant-baseline: central; }
    .label-mid { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #636261; text-anchor: middle; }
    .small { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 400; fill: #987da8; }
    .value { font-family: 'Inter', sans-serif; font-size: 12.5px; font-weight: 600; fill: #313131; dominant-baseline: central; }
    .value-mid { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #313131; text-anchor: middle; }
    .value-accent { fill: #725e7e; }
    .axis { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: #987da8; text-anchor: middle; }
    .axis-y { font-family: 'Inter', sans-serif; font-size: 11px; font-weight: 400; fill: #987da8; text-anchor: end; dominant-baseline: central; }
    .caption { font-family: 'Inter', sans-serif; font-size: 11.5px; font-style: italic; fill: #987da8; }
    .legend { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #636261; dominant-baseline: central; }
    .attribution { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #8a8985; letter-spacing: 0.04em; text-anchor: end; }
    .flag { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 700; fill: #b45309; }
    .flagnote { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #b45309; }
    
  </style>
  <text x="30" y="50" class="heading">CUMULATIVE LIVE-BIRTH RATE BY MATERNAL AGE</text>
  <line x1="30" y1="63" x2="730" y2="63" stroke="#c9b8d3" stroke-width="1"/>
  <text x="30" y="78" class="subtitle">Adjusted cumulative take-home-baby rate by age band (Sanchez-Mendez 2025, n=1,310; p&lt;0.001 across bands).</text>
  <line x1="80" y1="330" x2="720" y2="330" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="330" class="axis-y">0%</text>
  <line x1="80" y1="293" x2="720" y2="293" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="293" class="axis-y">15%</text>
  <line x1="80" y1="257" x2="720" y2="257" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="257" class="axis-y">30%</text>
  <line x1="80" y1="220" x2="720" y2="220" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="220" class="axis-y">45%</text>
  <line x1="80" y1="183" x2="720" y2="183" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="183" class="axis-y">60%</text>
  <line x1="80" y1="147" x2="720" y2="147" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="147" class="axis-y">75%</text>
  <line x1="80" y1="110" x2="720" y2="110" stroke="#ece9e5" stroke-width="1"/>
  <text x="72" y="110" class="axis-y">90%</text>
  <line x1="80" y1="330" x2="720" y2="330" stroke="#dddbd8" stroke-width="1.5"/>
  <rect x="120" y="125" width="110" height="205" rx="3" fill="#725e7e"/>
  <text x="175" y="115" class="value-mid value-accent" font-size="14px">83.7%</text>
  <text x="175" y="354" class="label-mid" font-weight="600" font-size="13px">18-30 yrs</text>
  <rect x="270" y="176" width="110" height="154" rx="3" fill="#725e7e"/>
  <text x="325" y="166" class="value-mid value-accent" font-size="14px">63.2%</text>
  <text x="325" y="354" class="label-mid" font-weight="600" font-size="13px">31-35 yrs</text>
  <rect x="420" y="200" width="110" height="130" rx="3" fill="#725e7e"/>
  <text x="475" y="190" class="value-mid value-accent" font-size="14px">53.3%</text>
  <text x="475" y="354" class="label-mid" font-weight="600" font-size="13px">36-40 yrs</text>
  <rect x="570" y="270" width="110" height="60" rx="3" fill="#c9b8d3"/>
  <text x="625" y="260" class="value-mid value-accent" font-size="14px">24.4%</text>
  <text x="625" y="354" class="label-mid" font-weight="600" font-size="13px">&gt;40 yrs</text>
  <text x="30" y="416" class="caption">Success declines with maternal age, as with all fertility care — but cumulative rates remain meaningful into the late 30s.</text>
  <text x="30" y="432" class="caption">Source: Sanchez-Mendez et al. 2025 (Figure 2B, adjusted cumulative).</text>
  <text x="730" y="448" class="attribution">rrmacademy.org/rrm-success-rates</text>
</svg>