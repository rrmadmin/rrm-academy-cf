<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 600" role="img" aria-label="RRM outcomes replicate across ten countries">
  <title>RRM Outcomes Replicate Across Ten Countries</title>
  <desc>A replication and coverage table, one row per country, showing the number of independent studies and the headline RRM success rate as text with its outcome-type label. Rates are shown as text, not as bars on a shared scale, because the outcome types (live-birth vs conception, crude vs adjusted-cumulative) are not directly comparable across countries.</desc>
  <rect width="760" height="600" fill="#28241e"/>
  <style>
    .heading { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 600; fill: #b0aaa2; letter-spacing: 0.05em; }
    .subtitle { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #b0aaa2; }
    .country { font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 600; fill: #dcd6ce; text-anchor: end; dominant-baseline: central; }
    .count { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #987da8; dominant-baseline: central; }
    .colhead { font-family: 'Inter', sans-serif; font-size: 10px; font-weight: 600; fill: #987da8; letter-spacing: 0.04em; }
    .rate { font-family: 'Inter', sans-serif; font-size: 12px; font-weight: 400; fill: #dcd6ce; dominant-baseline: central; }
    .caption { font-family: 'Inter', sans-serif; font-size: 11px; font-style: italic; fill: #987da8; }
    .legend { font-family: 'Inter', sans-serif; font-size: 11.5px; font-weight: 400; fill: #b0aaa2; dominant-baseline: central; }
    .attribution { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #8b827a; letter-spacing: 0.04em; text-anchor: end; }
    .flagnote { font-family: 'Inter', sans-serif; font-size: 10.5px; font-weight: 500; fill: #fbbf24; }
  </style>
  <text x="30" y="50" class="heading">RRM REPLICATES ACROSS TEN COUNTRIES</text>
  <line x1="30" y1="63" x2="730" y2="63" stroke="#6b5877" stroke-width="1"/>
  <text x="30" y="78" class="subtitle">International replication: 14 independent studies across 10 countries. Headline rate shown as text, labeled by outcome type.</text>
  <text x="174" y="88" class="colhead">STUDIES</text>
  <text x="318" y="88" class="colhead">HEADLINE RATE (BY OUTCOME TYPE)</text>
  <text x="160" y="116" class="country">Ireland</text>
  <circle cx="178" cy="116" r="4" fill="#b8a3c4"/>
  <circle cx="191" cy="116" r="4" fill="#b8a3c4"/>
  <circle cx="204" cy="116" r="4" fill="#b8a3c4"/>
  <text x="218" y="116" class="count">3 studies</text>
  <text x="318" y="116" class="rate">crude LBR 41% to adj. cum. LBR 52.8% @24mo</text>
  <line x1="30" y1="136" x2="730" y2="136" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="156" class="country">Spain</text>
  <circle cx="178" cy="156" r="4" fill="#b8a3c4"/>
  <text x="218" y="156" class="count">1 study</text>
  <text x="318" y="156" class="rate">crude LBR 35.3%; adj. cum. LBR 50.0% @24mo</text>
  <line x1="30" y1="176" x2="730" y2="176" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="196" class="country">Canada</text>
  <circle cx="178" cy="196" r="4" fill="#b8a3c4"/>
  <text x="218" y="196" class="count">1 study</text>
  <text x="318" y="196" class="rate">crude LBR 38%; adj. cum. LBR 66.0% @24mo</text>
  <line x1="30" y1="216" x2="730" y2="216" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="236" class="country">Ukraine</text>
  <circle cx="178" cy="236" r="4" fill="#b8a3c4"/>
  <text x="218" y="236" class="count">1 study</text>
  <text x="318" y="236" class="rate">crude LBR 41.5%; adj. cum. LBR 73.6% @24mo *</text>
  <line x1="30" y1="256" x2="730" y2="256" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="276" class="country">Australia</text>
  <circle cx="178" cy="276" r="4" fill="#b8a3c4"/>
  <circle cx="191" cy="276" r="4" fill="#b8a3c4"/>
  <text x="218" y="276" class="count">2 studies</text>
  <text x="318" y="276" class="rate">crude LBR 35.4%; adj. cum. 57.4% @24mo; pregnancy 62.5%</text>
  <line x1="30" y1="296" x2="730" y2="296" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="316" class="country">Italy</text>
  <circle cx="178" cy="316" r="4" fill="#6b6560"/>
  <circle cx="191" cy="316" r="4" fill="#6b6560"/>
  <text x="218" y="316" class="count">2 studies</text>
  <text x="318" y="316" class="rate">crude conception 40.9% to 51.2% @12mo</text>
  <line x1="30" y1="336" x2="730" y2="336" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="356" class="country">France</text>
  <circle cx="178" cy="356" r="4" fill="#6b6560"/>
  <text x="218" y="356" class="count">1 study</text>
  <text x="318" y="356" class="rate">crude conception 37%</text>
  <line x1="30" y1="376" x2="730" y2="376" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="396" class="country">Germany</text>
  <circle cx="178" cy="396" r="4" fill="#6b6560"/>
  <text x="218" y="396" class="count">1 study</text>
  <text x="318" y="396" class="rate">cum. conception 38% @8mo</text>
  <line x1="30" y1="416" x2="730" y2="416" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="436" class="country">USA</text>
  <circle cx="178" cy="436" r="4" fill="#b8a3c4"/>
  <text x="218" y="436" class="count">1 study</text>
  <text x="318" y="436" class="rate">adj. cum. LBR 29% @24mo</text>
  <line x1="30" y1="456" x2="730" y2="456" stroke="#332f2b" stroke-width="1"/>
  <text x="160" y="476" class="country">Multinational</text>
  <circle cx="178" cy="476" r="4" fill="#6b6560"/>
  <text x="218" y="476" class="count">1 study</text>
  <text x="318" y="476" class="rate">crude any-pregnancy 57% (methods cohort)</text>
  <circle cx="36" cy="518" r="4" fill="#b8a3c4"/>
  <text x="48" y="518" class="legend">Live-birth outcome</text>
  <circle cx="206" cy="518" r="4" fill="#6b6560"/>
  <text x="218" y="518" class="legend">Conception / pregnancy outcome</text>
  <text x="510" y="518" class="count">Dots = independent studies (not a rate)</text>
  <text x="30" y="542" class="flagnote">* Ukraine: non-indexed lower-tier journal.</text>
  <text x="30" y="561" class="caption">Italy ART comparator (17.8% per complete cycle) excluded: a different denominator cannot be compared to these rates.</text>
  <text x="730" y="580" class="attribution">rrmacademy.org/rrm-success-rates</text>
</svg>