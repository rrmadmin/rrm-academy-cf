<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>We will be back shortly | RRM Academy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" type="image/x-icon" />
  <style>
    :root {
      --accent: #725e7e;
      --circle: #987da8;
      --cream: #f7f5f3;
      --body-bg: #f7f5f3;
      --surface: #ffffff;
      --text: #2c2832;
      --text-soft: #6b6570;
      --border: #e2dce6;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --accent: #b8a3c4;
        --body-bg: #1e1a16;
        --surface: #28241e;
        --text: #ece8e2;
        --text-soft: #b3aca2;
        --border: #3a342e;
      }
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; }
    body {
      background: var(--body-bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 32px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.06);
    }
    .mark {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: var(--circle);
      color: var(--cream);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 44px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    .wordmark {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 0.01em;
      color: var(--text);
      margin: 0 0 28px;
    }
    h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 28px;
      font-weight: 600;
      margin: 0 0 12px;
      color: var(--text);
    }
    p {
      margin: 0 0 8px;
      color: var(--text-soft);
      font-size: 16px;
    }
    .status {
      margin-top: 24px;
      font-size: 13px;
      color: var(--text-soft);
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">R</div>
    <p class="wordmark">RRM Academy</p>
    <h1>We will be back shortly</h1>
    <p>RRM Academy is temporarily down for scheduled maintenance.</p>
    <p>Thank you for your patience. Please check back in a few minutes.</p>
    <p class="status">If this persists, email <a href="mailto:contact@rrmacademy.org">contact@rrmacademy.org</a>.</p>
  </main>
</body>
</html>
